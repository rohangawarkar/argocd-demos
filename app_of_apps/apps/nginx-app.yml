apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rohangawarkar/argocd-demos.git    # Replace it with your forked repo
    targetRevision: main
    path: ui_approach/nginx
  destination:
    server: https://172.31.7.117:33892   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true