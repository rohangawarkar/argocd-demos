apiVersion: argoproj.io.v1alpha1
kind: Application
metadata:
  name: apache-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rohangawarkar/argocd-demos.git    # Replace it with your forked repo
    targetRevision: main
    path: cli_approach/apache
  destination:
    server: https://172.31.7.117:33892
    namespace: default
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true